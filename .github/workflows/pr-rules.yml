name: PR rules

# Separate from CI so that editing the PR title re-checks the rules without restarting the tests.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-rules-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-rules:
    name: Release rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check PR title, version bump and changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE_VERSION=$(git show "origin/$BASE_REF:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("none")}})')
          node scripts/check-pr.mjs "$PR_TITLE" "$BASE_VERSION"
